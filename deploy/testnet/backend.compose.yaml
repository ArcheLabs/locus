services:
  jamscript-backend:
    image: ghcr.io/archelabs/jamscript-backend@sha256:40fc14f5a10d8f22803340da5fd7ce585356dfb9072b3d5a80ba565c0ddb83cf
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      JAMSCRIPT_BACKEND_BIND: 0.0.0.0:8090
      JAMSCRIPT_BACKEND_DATA: /var/lib/jamscript
      JAMSCRIPT_BACKEND_CORS_ORIGINS: https://locus.minijam.xyz
      JAMSCRIPT_NODE_RPC: http://node:9944
      JAMSCRIPT_FORMAL_RPC: http://formal-rpc:8080
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - /var/lib/locus/backend:/var/lib/jamscript
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks:
      - minijam-testnet-chain

networks:
  minijam-testnet-chain:
    external: true
    name: minijam-testnet-chain
