name: Locus Consumer CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  JAMSCRIPT_VERSION: v0.1.0-rc.8
  NODE_VERSION: 24.15.0

jobs:
  consumer:
    name: Consumer CI (published packages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install published consumer dependencies
        run: |
          npm ci
          npm --prefix web ci

      - name: Verify published Client package and phased API
        run: |
          npm ls @jamscript/client --depth=0
          npm --prefix web ls @jamscript/client --depth=0
          node scripts/assert-published-client.mjs

      - name: Install published JamScript CLI
        run: |
          curl -fsSL "https://raw.githubusercontent.com/ArcheLabs/JamScript/${JAMSCRIPT_VERSION}/install.sh" \
            | bash -s -- --version "${JAMSCRIPT_VERSION}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify published toolchain
        run: |
          jams --version
          jams toolchain verify

      - name: SDK and ownership model tests
        run: npm test

      - name: Verify Ownership Matrix adapter boundary
        run: ./scripts/check-ownership-adapter-boundary.sh

      - name: Build web client
        run: npm run build:web

      - name: Consumer service checks and ABI validation
        run: npm run check

      - name: Build canonical Locus PVM artifact
        run: npm run build
